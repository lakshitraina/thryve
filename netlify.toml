# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION — THRYVE FRONTEND
# ==============================================================================

[build]
  publish = "."
  command = "echo 'THRYVE Static Web Build Ready'"

# Proxy API calls directly to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://thryve-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback for client routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
